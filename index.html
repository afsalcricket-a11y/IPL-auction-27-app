<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPL Auction Game</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0b0b0e;--c:#141418;--g:#10b981;--am:#f59e0b;--t:#fff;--m:#8b8b99}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding:10px;max-width:640px}
h1{color:#fff;font-size:20px;margin:6px 0}.c,.cd{background:#141418;border:1px solid #24242c;border-radius:14px;padding:12px;margin:8px 0}
button,select,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #24242c;background:#1c1c22;color:var(--t);max-width:100%}
button{background:var(--am);color:#111;font-weight:700;border:0;cursor:pointer}button.s{background:#1c1c22;color:var(--t);border:1px solid #24242c}button:disabled{opacity:.4;cursor:not-allowed}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.row,.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:30px;font-weight:800}.m{color:var(--m);font-size:13px}.am{color:#f59e0b}.gr{color:#10b981}
.bar{height:8px;background:#1c1c22;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--am);transition:width .25s linear}
.hd{position:sticky;top:0;z-index:20;background:#0b0b0e;display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #24242c}
.on{color:#10b981;font-size:13px}.ib{display:inline-block;padding:6px 9px;font-size:13px;background:#1c1c22;color:#fff;border:1px solid #24242c;text-decoration:none;border-radius:8px}
.strip{background:#141418;border:1px solid #24242c;border-radius:10px;padding:6px 10px;margin:6px 0;display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
.bd{display:inline-block;padding:2px 8px;border-radius:6px;color:#fff;font-weight:700;font-size:12px}.bd.sq{padding:10px 12px;font-size:16px;border-radius:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-right:4px}
.nm{font-size:26px;font-weight:800;line-height:1.15;margin:6px 0}
.tm{background:#b91c1c;color:#fff;font-weight:800;padding:10px 12px;border-radius:8px;min-width:76px;text-align:center}
.bb{flex:1;padding:16px;font-size:18px;background:#10b981;color:#04130d;border-radius:12px}.bb.s{background:#1c1c22;color:#fff;border:1px solid #24242c}
.ban{text-align:center;padding:22px 12px}.pl{display:flex;gap:8px;align-items:center;background:#1c1c22;border-radius:10px;padding:8px 10px;margin:5px 0}
.sh{color:#f59e0b;font-weight:800;margin:12px 0 4px;display:flex;gap:8px;align-items:center}
.nav{display:flex;gap:6px;margin:8px 0}.nav button{flex:1;background:#141418;color:#fff;border:1px solid #24242c;font-size:18px;position:relative;padding:10px 4px}.nav button.on{border-color:#f59e0b;background:#1c1c22}
.bdg{position:absolute;top:-6px;right:-4px;background:#ef4444;color:#fff;font-size:11px;border-radius:999px;padding:1px 6px}
.ov{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center}.mo{background:#141418;border:1px solid #24242c;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;padding:12px;touch-action:pan-y}.mb{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tb{flex:1;background:#1c1c22;color:#fff;border:1px solid #24242c}.tb.on{background:#10b981;color:#04130d}
.mode{flex:1;min-width:150px;border:2px solid #24242c;border-radius:12px;padding:10px;background:#141418;cursor:pointer}.mode.on{border-color:#f59e0b}
.ev{padding:8px 10px;border-radius:8px;background:#1c1c22;margin:5px 0}.ev.sold{background:#064e3b;border:1px solid #10b981}.ev.trd{background:#3b2706;border:1px solid #f59e0b}
.tpill{padding:6px 10px;border-radius:8px;background:#1c1c22;border:1px solid #24242c;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;margin:3px}.tpill.sel{border-color:#10b981;background:#064e3b;color:#fff}
.tban{background:linear-gradient(90deg,#78350f,#b45309);border:1px solid #f59e0b;border-radius:12px;padding:10px 12px;margin:6px 0;text-align:center;font-weight:700}
.cf{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.cf i{position:absolute;top:-12px;width:8px;height:12px;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
</style></head><body><div id="app"><div class=c style="text-align:center;padding:30px"><b>🏏 Loading IPL Auction Game…</b></div></div>
<script>
const SB_URL='https://bunbqappmhcuzyyjvrpv.supabase.co',SB_KEY='sb_publishable_Vk_N_FRdKWzNxrIQnWraOg_t5OJkzs8';
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s);
const TEAMS=['CSK','MI','RCB','KKR','DC','SRH','RR','PBKS','GT','LSG'];
const COL={CSK:'#c9a200',MI:'#1b6ed1',RCB:'#d4202a',KKR:'#5b2a86',DC:'#2f6bd1',SRH:'#f26b21',RR:'#e8479b',PBKS:'#d9232d',GT:'#1f3a5f',LSG:'#0891b2'};
const KEY={rooms:'code',members:'room',room_teams:'room',room_players:'room',trades:'room',chat:'room',retention:'room',ret_lock:'room'};
const S={code:null,uid:null,rooms:null,members:[],room_teams:[],open:[],room_players:[],trades:[],chat:[],retention:[],ret_lock:[],P:{},on:[],tab:'chat',ev:[],ex:{},mt:'up',snd:localStorage.getItem('snd')!=='0',tf:{gp:[],rp:[]},acc:[],off:0,trBanner:null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cr=n=>'₹'+(+n).toFixed(2)+' Cr',inc=b=>b<1?.05:b<2?.1:b<5?.2:.25;
const me=()=>S.members.find(m=>m.uid==S.uid),myT=()=>me()?.team,isAdmin=()=>S.rooms?.admin==S.uid;
const sq=t=>S.room_players.filter(x=>x.team==t&&x.status=='sold');
const teamRtm=t=>{const r=S.rooms;if(!r||r.mode!='m2'||!t)return 0;const rt=S.room_teams.find(x=>x.team==t);const retN=S.retention.filter(x=>x.team==t&&x.choice=='retain').length;return rt&&rt.rtm!=null&&rt.rtm!==1?rt.rtm:Math.max(0,6-retN)};
async function rpc(f,a){const{error}=await sb.rpc(f,a);if(error){alert(error.message);return false}if(S.code){await Promise.all(['rooms','room_teams','room_players','members'].map(ld));render()}return true}
const ad=(act,p)=>rpc('admin_do',{c:S.code,act,p}),bid=()=>rpc('place_bid',{c:S.code}),pick=t=>rpc('pick_team',{c:S.code,t}),rt=(i,ok)=>rpc('respond_trade',{i,ok});
async function enter(c){S.code=c;localStorage.setItem('room',c);await Promise.all(Object.keys(KEY).map(ld));
 if(!S.rooms)return leave();sub();S.ready=true;render()}
function leave(){localStorage.removeItem('room');location.reload()}
function sub(){const ch=sb.channel('r'+S.code,{config:{presence:{key:S.uid}}});
 Object.keys(KEY).forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:KEY[t]+'=eq.'+S.code},async()=>{await ld(t);render()}));
 ch.on('presence',{event:'sync'},()=>{S.on=Object.keys(ch.presenceState());render()}).subscribe(s=>s=='SUBSCRIBED'&&ch.track({t:1}))}
function render(){
 const a=document.activeElement,id=a?.id,v=a?.value,p=a?.selectionStart;
 const mbEl=$('.mb');const scrollTop=mbEl?mbEl.scrollTop:0;
 $('#app').innerHTML=S.code?room():home();
 if(id){const e=document.getElementById(id);if(e){e.value=v;e.focus();try{e.setSelectionRange(p,p)}catch{}}}
 const newMb=$('.mb');if(newMb)newMb.scrollTop=scrollTop;
}
async function mk(){if(!S.nm)return alert('Enter your name');const{data,error}=await sb.rpc('create_room2',{nm:S.nm,md:S.md||'m2'});if(error)return alert(error.message);enter(data)}
async function jn(){const c=(S.cc||'').trim().toUpperCase();if(!S.nm||!c)return alert('Enter name and code');if(await rpc('join_room',{c,nm:S.nm}))enter(c)}

const lobby=()=>`<div class=c><b>Pick your team</b><div class=g>${TEAMS.map(t=>{const o=S.members.find(m=>m.team==t),x=o&&o.uid!=S.uid;
 return `<button style="background:${COL[t]};color:#fff;${x?'opacity:.35':''}" ${x?'disabled':''} onclick="pick('${t}')">${t}<br><small>${o?esc(o.name):'free'}</small></button>`}).join('')}</div>
<p class=m>In room: ${S.members.map(m=>esc(m.name)).join(', ')}</p>${isAdmin()?`<button class=bb style="width:100%" onclick="go()">▶ Start auction</button>`:'<p class=m>Waiting for the host to start…</p>'}</div>`;

function admin(){const r=S.rooms;if(!isAdmin()||r.status=='lobby'||r.status=='ended'||r.phase=='retention')return '';const pend=S.room_players.filter(x=>x.status=='pending');
 return `<div class=c><b>Host controls</b> <span class=m>${pend.length} players left</span><div class=row style="margin-top:6px">
${r.status=='paused'?`<button onclick="ad('resume')">▶ Resume</button>`:`<button class=s onclick="ad('pause')">⏸ Pause</button>`}
<button class=s onclick="ad('skip')">⏭ Skip</button><button class=s onclick="confirm('End auction?')&&ad('end')">⏹ End</button></div></div>`}

const go=()=>S.rooms.mode=='m2'?rpc('start_retention',{c:S.code}):ad('start');

function rtmb(r,my){if(!r.rtm_on)return '';
 const st=r.rtm_stage||1,curB=+r.bid;
 if(st==1){const minR=curB,defR=+(curB+0.5).toFixed(2);
  return `<div class=c style="border:2px solid #f59e0b;margin-top:8px"><b>⚡ RTM Stage 1 — ${r.rtm_team}'s Turn</b><div class=m>${r.bidder} won bidding at ${cr(curB)}. ${r.rtm_team} can raise the price or decline:</div>${my==r.rtm_team?`<div class=row style="margin-top:8px">${[0,0.5,1,2].map(d=>`<button class="chip ${d==0?'s':''}" onclick="$('#rtmv').value=(${curB}+${d}).toFixed(2)">${d==0?'Match '+cr(curB):'+'+d+' Cr'}</button>`).join('')}<input id=rtmv type=number step=0.25 min="${minR}" value="${defR}" style="width:95px"></div><div class=row style="margin-top:8px"><button class=bb style="padding:10px;font-size:15px" onclick="rpc('rtm_raise',{c:S.code,amt:+$('#rtmv').value})">⚡ Raise &amp; Use RTM</button><button class=s onclick="rpc('rtm_respond',{c:S.code,m:false})">Decline</button></div>`:'<p class=m>Waiting for '+r.rtm_team+' to set RTM counter-price…</p>'}</div>`}
 return `<div class=c style="border:2px solid #10b981;margin-top:8px"><b>⚡ RTM Stage 2 — ${r.bidder}'s Final Decision</b><div class=m>${r.rtm_team} raised the RTM price to <b class=gr>${cr(curB)}</b>!</div>${my==r.bidder?`<div class=row style="margin-top:8px"><button class=bb style="padding:10px;font-size:15px" onclick="rpc('rtm_respond',{c:S.code,m:true})">✅ Accept &amp; Buy (${cr(curB)})</button><button class=s onclick="rpc('rtm_respond',{c:S.code,m:false})">❌ Reject (Give to ${r.rtm_team})</button></div>`:'<p class=m>Waiting for '+r.bidder+' to accept or reject…</p>'}</div>`}

function sett(){if(!isAdmin())return '';const r=S.rooms,mb=r.max_bid||0;
 return `<div class=c><b>⚙️ Room &amp; Auction Settings</b>
<div class=row style="margin-top:8px"><label>Bid timer: <select onchange="setS('bid_sec',+this.value)"><option value=5 ${r.bid_sec==5?'selected':''}>5 sec</option><option value=10 ${r.bid_sec!=5?'selected':''}>10 sec</option></select></label></div>
<div style="margin-top:10px"><div class=m><b>Max Bid Cap per Player (Cr)</b> — host limit per player</div>
<div class=row style="margin-top:4px">${[[0,'Unlimited'],[15,'₹15 Cr'],[20,'₹20 Cr'],[25,'₹25 Cr'],[30,'₹30 Cr']].map(([v,l])=>`<button class="chip ${mb==v?'':'s'}" onclick="setS('max_bid',${v})">${l}</button>`).join('')}
<input id=mbx type=number min=0 step=0.5 placeholder="Custom Cr" value="${mb||''}" style="width:105px" onchange="setS('max_bid',+this.value||0)"></div></div>
<div class=row style="margin-top:10px">${[['late_join','Late joining'],['spectators','Spectators'],['ret_visible','Show retentions live'],['listed','Show in open rooms']].map(([k,l])=>`<label><input type=checkbox ${r[k]?'checked':''} onchange="setS('${k}',this.checked)"> ${l}</label>`).join('')}</div></div>`}

const setS=(k,v)=>{if(k=='listed')return rpc('set_listed',{c:S.code,b:v});const r={...S.rooms,[k]:v};rpc('admin_settings',{c:S.code,late:r.late_join,spec:r.spectators,vis:r.ret_visible,sec:r.bid_sec||10,mb:r.max_bid||0})};
const people=()=>`<div class=c><b>Participants</b> <span class=m>🟢 ${S.on.length} online / ${S.members.filter(m=>!m.removed).length}</span>${S.members.filter(m=>!m.removed).map(m=>`<div class=pl>${S.on.includes(m.uid)?'🟢':'⚪'} <b>${esc(m.name)}</b> <b style="color:${COL[m.team]||'var(--m)'}">${m.team||'spectator'}</b><span style="flex:1"></span>${isAdmin()&&m.uid!=S.uid?`<button class=s onclick="confirm('Remove?')&&rpc('remove_member',{c:S.code,u:'${m.uid}'})">Remove</button>`:''}${isAdmin()&&m.team?`<select onchange="rpc('transfer_team',{c:S.code,t:'${m.team}',u:this.value})"><option value="">Transfer…</option>${S.members.filter(x=>!x.removed&&!x.team).map(x=>`<option value=${x.uid}>${esc(x.name)}</option>`).join('')}</select>`:''}</div>`).join('')}</div>`;

const rp=(i,ch)=>rpc('retain_pick',{c:S.code,i,ch});
function ret(){const t=myT(),r=S.rooms,mine=Object.values(S.P).filter(p=>p.team26==t&&p.pool=='v2'),R=id=>S.retention.find(x=>x.pid==id),n=S.retention.filter(x=>x.team==t&&x.choice=='retain').length,lk=S.ret_lock.some(x=>x.team==t);
 const own=t?`<b>Your 2026 squad</b><p class=m>Retain up to 6 (₹18/14/11/9/7/4 Cr in order picked). <b>Retained: ${n}/6 · RTM cards after retention: ${6-n}</b> ${lk?'· 🔒 locked':''}</p>${mine.map(p=>{const c=R(p.id)?.choice;return `<div class=pl><span style="flex:1"><b>${p.name}</b> <span class=m>${p.role}</span></span><button class="${c=='retain'?'':'s'}" ${lk?'disabled':''} onclick="rp(${p.id},'retain')">Retain</button><button class="${c=='release'?'':'s'}" ${lk?'disabled':''} onclick="rp(${p.id},'release')">Release</button></div>`}).join('')}<br><button class=bb style="width:100%" ${lk?'disabled':''} onclick="rpc('lock_retention',{c:S.code})">🔒 Lock my choices</button>`:'<p class=m>Spectating the retention phase.</p>';
 return `<div class=c><h2 style="margin:0">Retention phase</h2><p class=m>Locked: ${S.ret_lock.map(x=>x.team).join(', ')||'none'} · ${r.ret_visible?'choices visible live':'choices hidden until retention ends'}</p><div class=m style="margin-bottom:8px">${S.members.filter(m=>m.team&&!m.removed).map(m=>{const c=S.retention.filter(x=>x.team==m.team&&x.choice=='retain').length;return m.team+': '+(m.team==t||r.ret_visible?`Retained ${c}/6 · RTM after: ${6-c}`:'hidden')+(S.ret_lock.some(x=>x.team==m.team)?' 🔒':'')}).join('<br>')}</div>${own}${isAdmin()?`<br><br><button class=bb style="width:100%" onclick="rpc('finish_retention',{c:S.code})">Finish retention → start mega auction</button>`:''}</div>`}

const cnt=t=>{const a=sq(t).map(s=>S.P[s.pid]).filter(Boolean);return{n:a.length,os:a.filter(p=>p.country!='India').length,bat:a.filter(p=>p.role=='Batter').length,wk:a.filter(p=>p.role=='WK-Batter').length,ar:a.filter(p=>p.role=='All-rounder').length,bowl:a.filter(p=>/^Bowler/.test(p.role)).length}};
const capHit=p=>{const r=S.rooms;if(!myT())return '';const nb=r.bidder?+r.bid+inc(+r.bid):+p.base;if(r.max_bid>0&&nb>+r.max_bid)return `Max Cap ₹${r.max_bid} Cr`;if(r.mode=='classic')return '';const c=cnt(myT());return c.n>=25?'Squad full 25/25':p.country!='India'&&c.os>=8?'Overseas full 8/8':''};
const share=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?room='+S.code).then(()=>alert('Room link copied!'),()=>prompt('Copy this link',location.origin+location.pathname+'?room='+S.code));



async function refOpen(q){const{data}=await sb.rpc('open_rooms');S.open=data||[];if(!q)render()}

const FILT={all:['All',()=>1],capped:['Capped',p=>p.set_order&&p.set_order<8],unc:['Uncapped',p=>p.set_order>=8],ind:['Indian',p=>p.country=='India'],os:['Overseas',p=>p.country!='India'],bat:['Batters',p=>p.role=='Batter'],wk:['WK',p=>p.role=='WK-Batter'],ar:['All-rounders',p=>p.role=='All-rounder'],fast:['Fast',p=>p.role=='Bowler (pace)'],spin:['Spin',p=>p.role=='Bowler (spin)']};
const remList=()=>S.room_players.filter(x=>x.status=='pending'&&x.pid!=S.rooms.cur).map(x=>S.P[x.pid]).filter(Boolean);
const ROLE={'Batter':['BAT','#3b82f6'],'WK-Batter':['WK','#f59e0b'],'All-rounder':['AR','#8b5cf6'],'Bowler (pace)':['BOWL','#ef4444'],'Bowler (spin)':['BOWL','#ef4444']};
const CITY={CSK:'Chennai',MI:'Mumbai',RCB:'Bengaluru',KKR:'Kolkata',DC:'Delhi',SRH:'Hyderabad',RR:'Rajasthan',PBKS:'Punjab',GT:'Gujarat',LSG:'Lucknow'};
const pill=(t,c)=>`<span class=pill style="background:${c}22;color:${c};border:1px solid ${c}55">${t}</span>`,bdg=t=>`<span class=bd style="background:${COL[t]||'#334'}">${t}</span>`;
const rpl=p=>{const r=ROLE[p.role]||['PLAYER','#64748b'];return pill(r[0],r[1])+(p.country!='India'?pill('OS','#8b5cf6'):'')};

function confetti(){const d=document.createElement('div');d.className='cf';d.innerHTML=Array.from({length:36},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#10b981','#f59e0b','#8b5cf6','#3b82f6','#ef4444'][i%5]};animation-delay:${Math.random()*.4}s"></i>`).join('');document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function ld(t){let q=sb.from(t).select().eq(KEY[t],S.code);if(t=='chat')q=q.order('id',{ascending:false}).limit(60);
 const{data}=await q,old=S[t],nw=t=='rooms'?data?.[0]:data||[];S[t]=nw;evt(t,old,nw)}

const openr=()=>`<div class=c><div class=row2><b>Live open rooms</b><span class=pill style="background:#10b98122;color:#10b981;border:1px solid #10b98155">${S.open.length}</span><span style="flex:1"></span><button class=ib onclick="refOpen()">↻</button></div>${S.open.map(r=>`<div class=pl><b class=am>${r.code}</b><span class=m>${r.mode} · ${r.status} · host ${esc(r.host)} · ${r.free} free</span><span style="flex:1"></span><button class=ib onclick="S.cc='${r.code}';jn()">Join</button></div>`).join('')||'<p class=m>No open rooms</p>'}</div>`;
const home=()=>`<div class=cd style="text-align:center"><h1 style="font-size:26px;margin:4px">🏏 IPL Auction Game</h1><div class=m>Play with Friends • No Sign Up Required</div></div><div class=c><input id=nm placeholder="Your Name" value="${esc(S.nm)}" oninput="S.nm=this.value" style="width:100%"><div class=m style="margin:10px 0 4px">Choose mode</div><div class=row2 style="flex-wrap:wrap">${[['m1','Mode 1','IPL 2027 Full Auction'],['m2','Mode 2','2026 Retention + Mega Auction + RTM'],['classic','Classic','30 sample players']].map(([k,t,d])=>`<div class="mode ${(S.md||'m2')==k?'on':''}" onclick="S.md='${k}';render()"><b>${t}</b><div class=m>${d}</div></div>`).join('')}</div><br><button class=bb style="width:100%" onclick="mk()">Create Room</button><hr style="border-color:#24242c"><div class=row2><input id=cc placeholder="Room code" value="${esc(S.cc)}" oninput="S.cc=this.value" style="flex:1;text-transform:uppercase"><button onclick="jn()">Join</button></div></div>${openr()}<details class=c><summary><b>How to Play &amp; Auction Rules</b></summary><div class=m style="margin-top:8px">• One host creates a room; friends join with the code or link.<br>• Each friend picks one franchise (₹120 Cr purse, max 25 players, max 8 overseas).<br>• Mode 2: retain up to 6 players; get (6 − retained) RTM cards with authentic counter-bid raises.<br>• Multi-player + cash trades are available in the 🤝 Trades tab at any time.<br>• Single Unified 14-Set Auction: All 14 sets (250 players) run continuously in one seamless auction without a separate Accelerated Set.</div></details>`;

const hdr=()=>{const on=S.on.length,tot=S.members.filter(m=>!m.removed).length,link=location.origin+location.pathname+'?room='+S.code;
